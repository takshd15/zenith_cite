<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Zenith social sharing image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      padding: 68px 76px;
      color: #14172b;
      background:
        radial-gradient(75% 140% at -5% 5%, rgba(95,224,224,.95), transparent 62%),
        radial-gradient(68% 125% at 100% 8%, rgba(242,168,224,.88), transparent 64%),
        radial-gradient(80% 110% at 62% 110%, rgba(184,240,216,.9), transparent 65%),
        radial-gradient(70% 110% at 52% -15%, rgba(201,182,242,.86), transparent 67%),
        #fbf7ec;
      font-family: Inter, Arial, sans-serif;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; position: relative; z-index: 1; font: 600 31px/1 "Space Grotesk", Arial, sans-serif; letter-spacing: -.05em; }
    .brand::before { content:""; width: 12px; height: 12px; border-radius: 1px; background: #14172b; transform: translateY(-9px); }
    h1 { max-width: 820px; margin: 112px 0 0; position: relative; z-index: 1; font: 600 76px/.98 "Space Grotesk", Arial, sans-serif; letter-spacing: -.057em; text-transform: lowercase; }
    .tag { position: absolute; right: 76px; bottom: 68px; z-index: 1; padding-top: 14px; border-top: 1px solid rgba(20,23,43,.4); font-size: 15px; font-weight: 600; }
    .arc { width: 620px; height: 250px; position: absolute; right: -240px; top: 130px; border: 1px solid rgba(20,23,43,.25); border-radius: 50%; transform: rotate(-24deg); }
    .arc::after { content:""; width:13px; height:13px; position:absolute; top:19px; left:110px; border-radius:50%; background:#14172b; }
  </style>
</head>
<body>
  <div class="brand">zenith</div>
  <h1>get found when your customers ask AI.</h1>
  <div class="tag">AI visibility audits · implementation · measurement</div>
  <div class="arc" aria-hidden="true"></div>
</body>
</html>
